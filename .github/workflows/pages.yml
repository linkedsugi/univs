name: Deploy workbook to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - name: Check Kyungbuk workbook
        run: node --check kbc1105/app.js && node --check kbc1105/data.js && node --check kbc1105/core.js && node --check kbc1105/materials.js
      - name: Prepare static site
        run: |
          mkdir -p _site/tk1104
          cp index.html app.js data.js style.css favicon.svg _site/
          cp index.html app.js data.js style.css favicon.svg _site/tk1104/
          cp tk1104/style.css _site/tk1104/style.css
          mkdir -p _site/kbc1105
          cp kbc1105/index.html kbc1105/app.js kbc1105/data.js kbc1105/style.css kbc1105/core.js kbc1105/materials.js _site/kbc1105/
          mkdir -p _site/kbc1105/materials _site/kbc1105/references
          cp kbc1105/materials/pt-questions-20.txt _site/kbc1105/materials/pt-questions-20.txt
          cp kbc1105/materials/electrical-wiring.png _site/kbc1105/materials/electrical-wiring.png
          cp kbc1105/materials/child-observations-12.txt _site/kbc1105/materials/child-observations-12.txt
          cp kbc1105/materials/rail-maintenance.csv _site/kbc1105/materials/rail-maintenance.csv
          cp kbc1105/materials/rag-questions-20.txt _site/kbc1105/materials/rag-questions-20.txt
          cp kbc1105/materials/lab-guidelines-10.md _site/kbc1105/materials/lab-guidelines-10.md
          cp kbc1105/materials/rag-guideline-01.pdf _site/kbc1105/materials/rag-guideline-01.pdf
          cp kbc1105/materials/rag-guideline-02.pdf _site/kbc1105/materials/rag-guideline-02.pdf
          cp kbc1105/materials/rag-guideline-03.pdf _site/kbc1105/materials/rag-guideline-03.pdf
          cp kbc1105/materials/rag-guideline-04.pdf _site/kbc1105/materials/rag-guideline-04.pdf
          cp kbc1105/materials/rag-guideline-05.pdf _site/kbc1105/materials/rag-guideline-05.pdf
          cp kbc1105/materials/rag-guideline-06.pdf _site/kbc1105/materials/rag-guideline-06.pdf
          cp kbc1105/materials/rag-guideline-07.pdf _site/kbc1105/materials/rag-guideline-07.pdf
          cp kbc1105/materials/rag-guideline-08.pdf _site/kbc1105/materials/rag-guideline-08.pdf
          cp kbc1105/materials/rag-guideline-09.pdf _site/kbc1105/materials/rag-guideline-09.pdf
          cp kbc1105/materials/rag-guideline-10.pdf _site/kbc1105/materials/rag-guideline-10.pdf
          cp kbc1105/materials/student-reflections-6.txt _site/kbc1105/materials/student-reflections-6.txt
          cp kbc1105/materials/kbc-practice-materials.zip _site/kbc1105/materials/kbc-practice-materials.zip
          cp kbc1105/references/claude-code-github-guide.pdf _site/kbc1105/references/claude-code-github-guide.pdf
          cp kbc1105/references/lecture-day-1.pdf _site/kbc1105/references/lecture-day-1.pdf
          cp kbc1105/references/lecture-day-2.pdf _site/kbc1105/references/lecture-day-2.pdf
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
